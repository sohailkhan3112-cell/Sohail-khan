name: Build FX Pro Bot APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract Android project
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle
        shell: bash
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FX-Pro-Bot-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
